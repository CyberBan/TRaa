<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#050607">
  <title>Тренировки — программы + журнал</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.png">
  <style>
    :root{
      --bg0:#050607; --bg1:#0a0c0f; --bg2:#101318;
      --glass: rgba(255,255,255,.06);
      --glass2: rgba(255,255,255,.04);
      --line: rgba(255,255,255,.12);
      --line2: rgba(255,255,255,.18);

      --text:#f5f6f7;
      --muted:#b9c0c9;
      --muted2:#8f97a3;

      --radius:18px; --radius2:22px;
      --shadow: 0 16px 44px rgba(0,0,0,.58);
      --shadow2: 0 10px 24px rgba(0,0,0,.45);

      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Arial;
      --ease: cubic-bezier(.2,.8,.2,1);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; font-family:var(--sans); color:var(--text);
      background:
        radial-gradient(1100px 760px at 15% 0%, rgba(255,255,255,.08) 0%, rgba(0,0,0,0) 60%),
        radial-gradient(1000px 720px at 85% 6%, rgba(255,255,255,.06) 0%, rgba(0,0,0,0) 58%),
        radial-gradient(600px 520px at 50% 120%, rgba(255,255,255,.05) 0%, rgba(0,0,0,0) 60%),
        linear-gradient(180deg, var(--bg1), var(--bg0));
      overflow-x:hidden;
    }
    body:before{
      content:""; position:fixed; inset:0;
      background:
        linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: radial-gradient(700px 460px at 50% 0%, black 35%, transparent 70%);
      pointer-events:none; opacity:.35; z-index:0;
    }

    .wrap{max-width:1180px; margin:0 auto; padding:22px; position:relative; z-index:1;}

    .top{display:flex; justify-content:space-between; align-items:flex-start; gap:14px; flex-wrap:wrap; margin-bottom:14px}
    .brand{display:flex; gap:12px; align-items:center}
    .logo{
      width:46px; height:46px; border-radius:16px;
      background: linear-gradient(135deg, rgba(255,255,255,.14), rgba(255,255,255,.04));
      border:1px solid rgba(255,255,255,.16);
      box-shadow: var(--shadow2);
      display:grid; place-items:center;
      position:relative; overflow:hidden;
    }
    .logo:after{
      content:""; position:absolute; inset:-40%;
      background: radial-gradient(circle, rgba(255,255,255,.22) 0%, rgba(0,0,0,0) 55%);
      transform: translate(-10%, -15%); opacity:.8;
    }
    .logo svg{opacity:.92; position:relative; z-index:1}
    h1{margin:0; font-size:18px; letter-spacing:.25px}
    .sub{margin-top:4px; color:var(--muted); font-size:12px; line-height:1.35; max-width:760px}
    .actions{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
    .pill{
      display:inline-flex; gap:8px; align-items:center;
      padding:9px 12px; border-radius:999px;
      background: rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.10);
      color:var(--muted); font-size:12px;
      backdrop-filter: blur(10px);
    }
    .pill b{color:var(--text); font-weight:780}

    .grid{display:grid; grid-template-columns: 420px 1fr; gap:14px; align-items:start;}
    @media (max-width: 1040px){ .grid{grid-template-columns:1fr} }

    .card{
      border-radius: var(--radius2);
      position:relative; overflow:hidden;
      box-shadow: var(--shadow);
      background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.03));
    }
    .card:before{
      content:""; position:absolute; inset:0; padding:1px; border-radius: inherit;
      background: linear-gradient(135deg, rgba(255,255,255,.22), rgba(255,255,255,.06));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude;
      pointer-events:none; opacity:.85;
    }
    .sticky{position:sticky; top:16px;}
    @media (max-width: 1040px){ .sticky{position:static} }

    .hdr{
      display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;
      padding:14px 16px;
      border-bottom:1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.22);
      backdrop-filter: blur(10px);
    }
    .hdr h2{margin:0; font-size:12px; color:var(--muted2); font-weight:900; letter-spacing:.7px; text-transform:uppercase}
    .cardPad{padding:16px}

    .kbd{
      font-family:var(--mono);
      font-size:12px;
      padding:2px 8px;
      border:1px solid rgba(255,255,255,.16);
      border-radius:999px;
      color:var(--muted2);
      background: rgba(0,0,0,.30);
    }

    label{display:block; font-size:12px; color:var(--muted); margin:12px 0 6px}
    input[type="date"], input[type="text"], select, textarea{
      width:100%;
      padding:12px 12px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.28);
      color:var(--text);
      outline:none;
      transition: border-color .15s var(--ease), transform .06s var(--ease);
    }
    textarea{min-height:110px; resize:vertical}
    select{
      appearance:none;
      background-image:
        linear-gradient(45deg, transparent 50%, rgba(255,255,255,.75) 50%),
        linear-gradient(135deg, rgba(255,255,255,.75) 50%, transparent 50%);
      background-position:
        calc(100% - 18px) calc(1em + 2px),
        calc(100% - 13px) calc(1em + 2px);
      background-size:5px 5px, 5px 5px;
      background-repeat:no-repeat;
    }
    input:focus, select:focus, textarea:focus{border-color: rgba(255,255,255,.28)}
    .row{display:flex; gap:10px; flex-wrap:wrap}
    .row > *{flex:1; min-width:160px}

    .small{font-size:12px; color:var(--muted2)}
    .note{color:var(--muted); font-size:12px; line-height:1.35}

    .btnRow{display:flex; gap:10px; flex-wrap:wrap; margin-top:12px}
    button{
      cursor:pointer;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.28);
      color:var(--text);
      padding:11px 12px;
      border-radius:14px;
      font-weight:880;
      transition: transform .08s var(--ease), border-color .18s var(--ease), background .18s var(--ease), filter .18s var(--ease);
      user-select:none;
    }
    button:hover{border-color: rgba(255,255,255,.28); background: rgba(0,0,0,.34); filter: brightness(1.05)}
    button:active{transform: translateY(1px)}
    button.primary{background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.06)); border-color: rgba(255,255,255,.26)}
    button.danger{border-color: rgba(255,255,255,.18); background: rgba(0,0,0,.22)}
    button.small{padding:8px 10px; font-weight:850; font-size:12px; border-radius:12px}

    .progressWrap{margin-top:12px}
    .progressLine{
      height:10px; border-radius:999px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.26);
      overflow:hidden;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
    }
    .progressBar{
      height:100%; width:0%;
      background: linear-gradient(90deg, rgba(255,255,255,.95), rgba(255,255,255,.55));
      transition: width .25s var(--ease);
    }
    .progressMeta{display:flex; justify-content:space-between; gap:10px; margin-top:8px; font-size:12px; color:var(--muted)}

    .stats{
      display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:12px;
    }
    .stat{
      border-radius:16px;
      background: rgba(0,0,0,.22);
      position:relative; overflow:hidden;
    }
    .stat:before{
      content:""; position:absolute; inset:0; padding:1px; border-radius:inherit;
      background: linear-gradient(135deg, rgba(255,255,255,.18), rgba(255,255,255,.06));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude;
      pointer-events:none; opacity:.9;
    }
    .statPad{padding:10px 12px; position:relative}
    .stat .k{font-size:11px; color:var(--muted2); letter-spacing:.3px; text-transform:uppercase; font-weight:850}
    .stat .v{margin-top:4px; font-family:var(--mono); font-size:16px; color:var(--text)}

    .workTitle{display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; align-items:baseline}
    .workTitle h3{margin:0; font-size:16px}
    .badge{
      display:inline-flex; align-items:center; gap:8px;
      font-family:var(--mono);
      font-size:12px;
      padding:6px 10px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.22);
      color:#e7eaef;
    }

    .ex{
      margin-top:12px;
      border-radius:18px;
      background: rgba(0,0,0,.24);
      position:relative;
      overflow:hidden;
    }
    .ex:before{
      content:""; position:absolute; inset:0; padding:1px; border-radius: inherit;
      background: linear-gradient(135deg, rgba(255,255,255,.18), rgba(255,255,255,.06));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude;
      pointer-events:none; opacity:.9;
    }
    .exHead{
      display:flex; justify-content:space-between; gap:10px; align-items:flex-start; flex-wrap:wrap;
      padding:12px 12px 10px;
      position:relative;
    }
    .exName{margin:0; font-size:13px; line-height:1.25; letter-spacing:.15px}
    .exMeta{display:flex; gap:8px; flex-wrap:wrap; margin-top:6px}
    .tag{
      font-family:var(--mono);
      font-size:12px;
      padding:4px 8px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.04);
      color:#eef0f3;
    }
    .tag.muted{color:var(--muted2)}
    .exRight{display:flex; gap:8px; align-items:center;}
    .exDone{
      font-family:var(--mono);
      font-size:12px;
      padding:6px 10px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.22);
      color: var(--muted);
      white-space:nowrap;
    }

    .setGrid{
      display:grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap:10px;
      padding:0 12px 12px;
      position:relative;
    }
    @media (max-width: 520px){ .setGrid{grid-template-columns: 1fr} }

    .setRow{
      display:flex; align-items:center; gap:10px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.03);
      border-radius:14px;
      padding:8px 10px;
      transition: transform .08s var(--ease), border-color .18s var(--ease), background .18s var(--ease);
      cursor:pointer;
      user-select:none;
    }
    .setRow:hover{border-color: rgba(255,255,255,.22); background: rgba(255,255,255,.05); transform: translateY(-1px)}
    .setRow input[type="checkbox"]{width:18px; height:18px; accent-color:#f4f5f6; cursor:pointer}
    .setRow .s{font-size:12px; color:var(--muted); min-width:64px}

    .mini{
      width:100%;
      padding:9px 10px !important;
      border-radius:12px !important;
      font-size:12px;
      font-family:var(--mono);
      background: rgba(0,0,0,.18);
      border:1px solid rgba(255,255,255,.14);
      color:var(--text);
      outline:none;
    }
    .mini::placeholder{color: rgba(185,192,201,.55)}
    .mini:focus{border-color: rgba(255,255,255,.28)}

    details{
      border-radius:18px;
      background: rgba(0,0,0,.22);
      position:relative;
      overflow:hidden;
      margin-top:12px;
    }
    details:before{
      content:""; position:absolute; inset:0; padding:1px; border-radius:inherit;
      background: linear-gradient(135deg, rgba(255,255,255,.18), rgba(255,255,255,.06));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude;
      pointer-events:none; opacity:.9;
    }
    summary{
      cursor:pointer;
      padding:12px 12px;
      font-weight:900;
      letter-spacing:.3px;
      color: var(--text);
      list-style:none;
      position:relative;
    }
    summary::-webkit-details-marker{display:none}
    .detailsPad{padding:0 12px 12px; position:relative}

    .historyItem{
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.03);
      border-radius:14px;
      padding:10px 10px;
      margin-top:10px;
    }
    .historyTop{display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap}
    .historyTop .t{font-weight:900}
    .historyTop .s{color:var(--muted2); font-size:12px; font-family:var(--mono)}
    .historyBtns{display:flex; gap:10px; flex-wrap:wrap; margin-top:10px}

    .timerBox{
      margin-top:12px;
      border-radius:18px;
      background: rgba(0,0,0,.22);
      position:relative;
      overflow:hidden;
    }
    .timerBox:before{
      content:""; position:absolute; inset:0; padding:1px; border-radius:inherit;
      background: linear-gradient(135deg, rgba(255,255,255,.18), rgba(255,255,255,.06));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude;
      pointer-events:none; opacity:.9;
    }
    .timerPad{padding:10px 12px; position:relative}
    .timerTop{display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; align-items:baseline}
    .timerTop .v{font-family:var(--mono); font-size:18px}
    .timerTop .k{font-size:11px; color:var(--muted2); font-weight:850; letter-spacing:.3px; text-transform:uppercase}
    .timerBtns{display:flex; gap:10px; flex-wrap:wrap; margin-top:10px}


    /* iPhone / mobile first adjustments */
    html{-webkit-text-size-adjust:100%;}
    body{
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }
    .wrap{
      padding: max(16px, env(safe-area-inset-left)) max(16px, env(safe-area-inset-right));
    }

    /* Prevent iOS input zoom */
    input[type="date"], input[type="text"], select, textarea, .mini{
      font-size:16px;
    }

    /* Tap targets */
    button{
      min-height:44px;
      padding:12px 14px;
    }
    button.small{
      min-height:40px;
      padding:10px 12px;
    }
    .setRow{
      min-height:52px;
    }

    /* Make layout single column earlier, and reduce side padding */
    @media (max-width: 980px){
      .grid{grid-template-columns:1fr;}
      .sticky{position:static;}
    }
    @media (max-width: 520px){
      .wrap{padding:14px;}
      .top{margin-bottom:12px;}
      .logo{width:42px;height:42px;border-radius:14px;}
      h1{font-size:17px;}
      .actions{gap:8px;}
      .pill{padding:8px 10px;}
      .hdr{padding:12px 12px;}
      .cardPad{padding:12px;}
      .row{gap:10px;}
      .stats{grid-template-columns:1fr 1fr; gap:10px;}
      .workTitle h3{font-size:15px;}
      .badge{font-size:12px;}
      .setGrid{grid-template-columns:1fr; gap:10px;}
      .timerBtns button.small{flex:1;}
    }

    /* Smoother scrolling on iOS */
    body{ -webkit-overflow-scrolling: touch; }


    @media (prefers-reduced-motion: reduce){
      *{transition:none !important; scroll-behavior:auto !important}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path d="M7 20V10.5C7 8.01472 9.01472 6 11.5 6H13C15.7614 6 18 8.23858 18 11V20" stroke="rgba(255,255,255,.88)" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M6 14h13" stroke="rgba(255,255,255,.70)" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </div>
        <div>
          <h1>Тренировки</h1>
</div>
      </div>
</div>

    <div class="grid">
      <aside class="card sticky">
        <div class="hdr">
          <h2>Панель</h2>
</div>
        <div class="cardPad">
          <div class="row">
            <div>
              <label for="date">Дата</label>
              <input id="date" type="date" />
            </div>
            <div>
              <label for="template">Шаблон недели</label>
              <select id="template">
                <option value="4_hyp">4×/нед (масса PPL+G)</option>
                <option value="3_fb">3×/нед (full body)</option>
                <option value="5_str">5×/нед (силовой)</option>
                <option value="6_ppl">6×/нед (PPL×2)</option>
              </select>
            </div>
          </div>

          <label for="program">Программа</label>
          <select id="program"></select>
<div class="btnRow">
            <button class="primary" id="btnToday">Сегодня / Следующая</button>
            <button id="btnSave">Сохранить в журнал</button>
          </div>

          <div class="btnRow" style="margin-top:10px">
            <button class="danger" id="btnReset">Сбросить ввод (дата+прога)</button>
            <button id="btnCopy">Скопировать заметку</button>
          </div>

          <div class="progressWrap">
            <div class="progressLine"><div class="progressBar" id="progressBar"></div></div>
            <div class="progressMeta">
              <span id="progressText">0%</span>
              <span id="progressSets">0/0 подходов</span>
            </div>
          </div>

          <div class="stats">
            <div class="stat"><div class="statPad">
              <div class="k">Тоннаж</div>
              <div class="v" id="tonnage">0 кг</div>
            </div></div>
            <div class="stat"><div class="statPad">
              <div class="k">Упражнений</div>
              <div class="v" id="exCount">0</div>
            </div></div>
          </div>

          <div class="timerBox">
            <div class="timerPad">
              <div class="timerTop">
                <div>
                  <div class="k">Таймер отдыха</div>
                  <div class="v" id="timerText">00:00</div>
                </div>
                <div class="small" id="timerState">—</div>
              </div>
              <div class="timerBtns">
                <button class="small" data-t="60">60с</button>
                <button class="small" data-t="90">90с</button>
                <button class="small" data-t="120">120с</button>
                <button class="small" data-t="180">180с</button>
                <button class="small" id="timerStop">Стоп</button>
              </div>
            </div>
          </div>

          <details open>
            <summary>Журнал (последние 12)</summary>
            <div class="detailsPad" id="history"></div>
          </details>

          <details>
            <summary>Поиск упражнения</summary>
            <div class="detailsPad">
              <label for="search">Номер или название</label>
              <input id="search" type="text" placeholder="например: 05-03 или 'жим' или 'подтяг'" />
              
              <div id="searchResults"></div>
            </div>
          </details>

          <details>
            <summary>Импорт/экспорт программ</summary>
            <div class="detailsPad">
              <div class="btnRow">
                <button class="small" id="btnExport">Экспорт</button>
                <button class="small" id="btnImport">Импорт</button>
                <button class="small" id="btnResetPrograms">Сбросить программы</button>
              </div>
              <label for="jsonArea">JSON</label>
              <textarea id="jsonArea" placeholder="Нажми «Экспорт» или вставь JSON и нажми «Импорт»"></textarea>
            </div>
          </details>

          </div>
      </aside>

      <main class="card">
        <div class="hdr">
          <h2>Тренировка</h2>
          
        </div>
        <div class="cardPad">
          <div class="workTitle">
            <h3 id="workTitle">—</h3>
</div>
          <div class="note" id="workNote" style="margin-top:6px"></div>
          <div id="workout"></div>
        </div>
      </main>
    </div>
  </div>

<script>
  const EX = {
    "01-01":"Попеременные сгибания рук с гантелями",
    "01-02":"Концентрированное сгибание одной руки с гантелью",
    "01-03":"Сгибание рук с гантелями хватом «молоток»",
    "01-04":"Сгибание одной руки с рукояткой нижнего блока",
    "01-05":"Сгибание рук с рукоятками верхних блоков",
    "01-06":"Сгибание рук с грифом штанги",
    "01-07":"Сгибание рук на тренажёре «Larry-Scott»",
    "01-08":"Сгибание рук на скамье «Larry-Scott»",
    "01-09":"Сгибание рук со штангой хватом сверху",
    "01-10":"Разгибание запястий со штангой хватом сверху",
    "01-11":"Сгибание запястий со штангой хватом снизу",
    "01-12":"Разгибание рук с рукояткой верхнего блока хватом сверху",
    "01-13":"Разгибание рук с рукояткой верхнего блока хватом снизу",
    "01-14":"Разгибание одной руки с верхним блоком хватом снизу",
    "01-15":"Разгибание рук со штангой лёжа",

  function todayISO(){
    const d = new Date();
    const z = (n)=>String(n).padStart(2,"0");
    return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;
  }
  function formatMMSS(sec){
    const m = Math.floor(sec/60);
    const s = sec%60;
    return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  }

  function loadPrograms(){
    const raw = localStorage.getItem(K.programs);
    if(!raw) return structuredClone(DEFAULT_PROGRAMS);
    try{
      const obj = JSON.parse(raw);
      if(!obj || typeof obj !== "object") return structuredClone(DEFAULT_PROGRAMS);
      return obj;
    }catch{
      return structuredClone(DEFAULT_PROGRAMS);
    }
  }
  function savePrograms(obj){ localStorage.setItem(K.programs, JSON.stringify(obj)); }

  function loadState(date, prog){
    const raw = localStorage.getItem(K.state(date, prog));
    if(!raw) return null;
    try{ return JSON.parse(raw); }catch{ return null; }
  }
  function saveState(date, prog, state){
    localStorage.setItem(K.state(date, prog), JSON.stringify(state));
  }
  function clearState(date, prog){
    localStorage.removeItem(K.state(date, prog));
  }
  function ensureState(date, prog, PROGRAMS){
    const p = PROGRAMS[prog];
    const state = loadState(date, prog) || { date, prog, ex:{} };

    p.items.forEach(it=>{
      if(!state.ex[it.id]) state.ex[it.id] = { sets: [] };
      const arr = state.ex[it.id].sets;
      while(arr.length < it.sets) arr.push({ done:false, w:"", r:"" });
      if(arr.length > it.sets) arr.length = it.sets;
    });

    saveState(date, prog, state);
    return state;
  }

  function computeStats(PROGRAMS, date, prog){
    const p = PROGRAMS[prog];
    const state = loadState(date, prog) || { ex:{} };
    let total = 0, done = 0, ton = 0;

    p.items.forEach(it=>{
      total += it.sets;
      const sets = state.ex?.[it.id]?.sets || [];
      sets.forEach(s=>{
        if(s?.done) done++;
        const w = Number(String(s?.w ?? "").replace(",", "."));
        const r = Number(String(s?.r ?? "").replace(",", "."));
        if(s?.done && w>0 && r>0) ton += w*r;
      });
    });

    const pct = total ? Math.round((done/total)*100) : 0;
    return { total, done, pct, ton: Math.round(ton) };
  }

  function perExerciseDone(state, it){
    const sets = state.ex?.[it.id]?.sets || [];
    let d = 0;
    sets.forEach(s=>{ if(s?.done) d++; });
    return { d, t: it.sets };
  }

    try{

    }catch{ return []; }

  function writeHistory(arr){
    localStorage.setItem(K.history, JSON.stringify(arr.slice(0, 200)));

  function addHistory(entry){
    const arr = readHistory();
    const key = `${entry.date}::${entry.prog}`;
    const filtered = arr.filter(x => `${x.date}::${x.prog}` !== key);
    filtered.unshift(entry);
    writeHistory(filtered);
  }

      return;

    const items = Object.entries(EX)

    if(items.length === 0){
      elSearchResults.innerHTML = `<div class="small" style="margin-top:10px">Ничего не найдено.</div>`;

  function groupOrderKey(g){
    const idx = GROUP_ORDER.indexOf(g);

  function fillProgramSelect(PROGRAMS){
    elProgram.innerHTML = "";
    const groups = Array.from(new Set(Object.values(PROGRAMS).map(p=>p.group || "Другое")))
      .sort((a,b)=> groupOrderKey(a)-groupOrderKey(b) || a.localeCompare(b));

    groups.forEach(g=>{
      const og = document.createElement("optgroup");
      og.label = g;

      Object.keys(PROGRAMS)
        .filter(k => (PROGRAMS[k].group || "Другое") === g)
        .sort((a,b)=> (PROGRAMS[a].name||a).localeCompare(PROGRAMS[b].name||b))

          o.value = k;
          o.textContent = PROGRAMS[k].name || k;
          og.appendChild(o);
        });

      elProgram.appendChild(og);
    });

  function getCycle(tpl){
    const raw = localStorage.getItem(K.cycle(tpl));
    const n = Number(raw);
    return Number.isFinite(n) ? n : 0;
  }
  function setCycle(tpl, idx){
    localStorage.setItem(K.cycle(tpl), String(idx));
  }
  function pickNextProgram(PROGRAMS){
    const tpl = elTemplate.value;
    const order = TEMPLATES[tpl]?.order || [];
    if(order.length === 0) return null;

    let idx = getCycle(tpl);
    idx = ((idx % order.length) + order.length) % order.length;
    let prog = order[idx];

    if(!PROGRAMS[prog]){
      prog = order.find(k => PROGRAMS[k]) || Object.keys(PROGRAMS)[0];
    }
    setCycle(tpl, (idx + 1) % order.length);
    return prog;
  }

          <div class="exName">${exTitle}</div>
          <div class="exMeta">
            <span class="tag">${it.id}</span>
            <span class="tag muted">${it.sets}×${it.reps}</span>
          </div>
        </div>
        <div class="exRight">
          <div class="exDone" data-exdone="${it.id}">${d}/${t} подходов</div>
        </div>
      `;

      const grid = document.createElement("div");
      grid.className = "setGrid";

      for(let i=0;i<it.sets;i++){
        const s0 = state.ex[it.id].sets[i] || {done:false,w:"",r:""};

        const row = document.createElement("div");
        row.className = "setRow";

        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = !!s0.done;

        const label = document.createElement("div");
        label.className = "s";
        label.textContent = `Подход ${i+1}`;

        const w = document.createElement("input");
        w.type = "text";
        w.className = "mini";
        w.placeholder = "кг";
        w.value = s0.w ?? "";

        const r = document.createElement("input");
        r.type = "text";
        r.className = "mini";
        r.placeholder = "повт";
        r.value = s0.r ?? "";

        const commit = ()=>{
          const st = ensureState(date, prog, PROGRAMS);
          st.ex[it.id].sets[i] = { done: cb.checked, w: (w.value||"").trim(), r: (r.value||"").trim() };
          saveState(date, prog, st);
          renderSidebarStats(PROGRAMS);
          const {d,t} = perExerciseDone(st, it);
          const exDoneEl = box.querySelector(`[data-exdone="${it.id}"]`);
          if(exDoneEl) exDoneEl.textContent = `${d}/${t} подходов`;
        };

        row.addEventListener("click", (e)=>{
          if(e.target && e.target.tagName === "INPUT") return;
          cb.checked = !cb.checked;
          commit();
        });

        cb.addEventListener("change", commit);
        w.addEventListener("input", commit);
        r.addEventListener("input", commit);

        row.appendChild(cb);
        row.appendChild(label);
        row.appendChild(w);
        row.appendChild(r);

        grid.appendChild(row);
      }

      box.appendChild(head);
      box.appendChild(grid);
      elWorkout.appendChild(box);
    });

    renderSidebarStats(PROGRAMS);
  }

  function renderSidebarStats(PROGRAMS){
    const date = elDate.value;
    const prog = elProgram.value;
    if(!date || !prog || !PROGRAMS[prog]) return;

    const stats = computeStats(PROGRAMS, date, prog);
    elProgressBar.style.width = stats.pct + "%";
    elProgressText.textContent = stats.pct + "%";
    elProgressSets.textContent = `${stats.done}/${stats.total} подходов`;
    elTonnage.textContent = `${stats.ton} кг`;
  }

  function makeNote(PROGRAMS, date, prog){
    const p = PROGRAMS[prog];
    const state = loadState(date, prog) || { ex:{} };
    const stats = computeStats(PROGRAMS, date, prog);

    const lines = [];
    lines.push(`Тренировка: ${p.name}`);
    lines.push(`Категория: ${p.group}`);
    lines.push(`Дата: ${date}`);
    lines.push("");

    p.items.forEach(it=>{
      const title = EX[it.id] || "—";
      const sets = state.ex?.[it.id]?.sets || [];
      const done = sets.filter(s=>s?.done).length;
      const parts = sets.map((s, idx)=>{
        const mark = s?.done ? "✓" : "•";
        const ww = (s?.w||"").trim() || "—";
        const rr = (s?.r||"").trim() || "—";
        return `${mark}${idx+1}:${ww}x${rr}`;
      }).join("  ");

      lines.push(`${it.id} — ${title} — ${it.sets}×${it.reps} (сделано: ${done}/${it.sets})`);
      lines.push(`   ${parts}`);
    });

    lines.push("");
    lines.push(`Итого: ${stats.done}/${stats.total} подходов · ${stats.pct}% · тоннаж ${stats.ton} кг`);
    return lines.join("\n");
  }

  let PROGRAMS = loadPrograms();

  function renderAll(){
    if(!elDate.value) elDate.value = todayISO();
    fillProgramSelect(PROGRAMS);

    const chosen = elProgram.value;
    if(!(chosen && PROGRAMS[chosen])){
      const first = Object.keys(PROGRAMS)[0];
      if(first) elProgram.value = first;
    }

    renderWorkout(PROGRAMS);
    renderHistory(PROGRAMS);
    renderSearch(elSearch.value);
  }

  // Timer
  let timerInt = null;
  let timerLeft = 0;

  function timerStop(){
    if(timerInt) clearInterval(timerInt);
    timerInt = null;
    timerLeft = 0;
    elTimerText.textContent = "00:00";
    elTimerState.textContent = "—";
  }

  function timerStart(seconds){
    if(timerInt) clearInterval(timerInt);
    timerLeft = seconds;
    elTimerText.textContent = formatMMSS(timerLeft);
    elTimerState.textContent = `${seconds}s`;

    timerInt = setInterval(()=>{
      timerLeft = Math.max(0, timerLeft - 1);
      elTimerText.textContent = formatMMSS(timerLeft);
      if(timerLeft === 0){
        clearInterval(timerInt);
        timerInt = null;
        elTimerState.textContent = "Готово";
        try{
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.type = "sine"; o.frequency.value = 880;
          o.connect(g); g.connect(ctx.destination);
          g.gain.setValueAtTime(0.001, ctx.currentTime);
          g.gain.exponentialRampToValueAtTime(0.12, ctx.currentTime + 0.02);
          g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.22);
          o.start(); o.stop(ctx.currentTime + 0.25);
          setTimeout(()=>ctx.close(), 300);
        }catch{}
      }
    }, 1000);
  }

  // Events
  $("btnToday").addEventListener("click", ()=>{
    elDate.value = todayISO();
    const next = pickNextProgram(PROGRAMS);
    if(next) elProgram.value = next;
    renderAll();
  });

  $("btnSave").addEventListener("click", ()=>{
    const date = elDate.value;
    const prog = elProgram.value;
    if(!date || !prog || !PROGRAMS[prog]) return;
    const st = computeStats(PROGRAMS, date, prog);
    addHistory({ date, prog, total: st.total, done: st.done, pct: st.pct, ton: st.ton });
    renderHistory(PROGRAMS);
    /*saved*/
  });

  $("btnReset").addEventListener("click", ()=>{
    const date = elDate.value;
    const prog = elProgram.value;
    if(!date || !prog) return;
    clearState(date, prog);
    renderAll();
  });

  $("btnCopy").addEventListener("click", async ()=>{
    const date = elDate.value;
    const prog = elProgram.value;
    if(!date || !prog || !PROGRAMS[prog]) return;
    const text = makeNote(PROGRAMS, date, prog);
    try{ await navigator.clipboard.writeText(text); }catch{}
    /*copied*/
  });

  elDate.addEventListener("change", ()=>renderAll());
  elProgram.addEventListener("change", ()=>renderAll());
  elSearch.addEventListener("input", ()=>renderSearch(elSearch.value));

  document.querySelectorAll("[data-t]").forEach(b=>{
    b.addEventListener("click", ()=>timerStart(Number(b.getAttribute("data-t"))));
  });
  btnStop.addEventListener("click", timerStop);

  $("btnExport").addEventListener("click", ()=>{
    elJsonArea.value = JSON.stringify(PROGRAMS, null, 2);
  });

  $("btnImport").addEventListener("click", ()=>{
    const raw = elJsonArea.value.trim();
    if(!raw){ /*no_json*/ return; }
    try{
      const obj = JSON.parse(raw);
      if(!obj || typeof obj !== "object"){ alert("JSON должен быть объектом."); return; }
      for(const v of Object.values(obj)){
        if(!v || typeof v !== "object") throw new Error("bad program");
        if(!Array.isArray(v.items)) throw new Error("bad items");
      }
      PROGRAMS = obj;
      savePrograms(PROGRAMS);
      renderAll();
      /*imported*/
    }catch(e){
      /*import_failed*/
    }
  });

  $("btnResetPrograms").addEventListener("click", ()=>{
    PROGRAMS = structuredClone(DEFAULT_PROGRAMS);
    savePrograms(PROGRAMS);
    renderAll();
    /*reset*/
  });

  function getCycle(tpl){
    const raw = localStorage.getItem(K.cycle(tpl));
    const n = Number(raw);
    return Number.isFinite(n) ? n : 0;
  }
  function setCycle(tpl, idx){
    localStorage.setItem(K.cycle(tpl), String(idx));
  }

  // Init
  elDate.value = todayISO();
  renderAll();
</script>
</body>
</html>
